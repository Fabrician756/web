<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { padding: 10px 20px; background: white; border: none; border-radius: 5px; cursor: pointer; }
        .nav-btn.active { background: #667eea; color: white; }
        .section { display: none; background: white; padding: 20px; border-radius: 10px; }
        .section.active { display: block; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; text-align: center; border-left: 4px solid #667eea; }
        .upload-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .upload-tab { padding: 10px 20px; background: #eee; border: none; border-radius: 5px; cursor: pointer; }
        .upload-tab.active { background: #667eea; color: white; }
        .upload-area { border: 2px dashed #ccc; padding: 30px; text-align: center; margin: 10px 0; border-radius: 10px; cursor: pointer; }
        .upload-area.has-file { border-color: #00b894; background: #f0fff0; }
        .file-input { display: none; }
        .form-group { margin: 15px 0; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .apk-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .apk-card { background: white; padding: 15px; border-radius: 10px; border: 1px solid #eee; text-align: center; }
        .apk-icon { width: 50px; height: 50px; margin-bottom: 10px; }
        .message { padding: 10px; margin: 10px 0; border-radius: 5px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Admin Dashboard</h2>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="showSection('dashboard')">Dashboard</button>
        <button class="nav-btn" onclick="showSection('upload')">Upload</button>
        <button class="nav-btn" onclick="showSection('manage')">Manage</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" class="section active">
        <h3>Overview</h3>
        <div class="stats">
            <div class="stat-card">
                <div style="font-size: 24px; font-weight: bold;" id="totalApks">0</div>
                <div>Total APKs</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 24px; font-weight: bold;" id="linkApks">0</div>
                <div>Link APKs</div>
            </div>
        </div>
        <button class="btn btn-primary" onclick="showSection('upload')">Upload APK</button>
        <button class="btn" onclick="showSection('manage')">Manage APKs</button>
    </div>

    <!-- Upload Section -->
    <div id="upload" class="section">
        <h3>Upload APK</h3>
        
        <div class="upload-tabs">
            <button class="upload-tab active" onclick="showUploadTab('file')">Upload File</button>
            <button class="upload-tab" onclick="showUploadTab('link')">Upload Link</button>
        </div>

        <!-- File Upload -->
        <div id="file-upload">
            <div class="upload-area" onclick="document.getElementById('apkFile').click()" id="apkArea">
                <div>📱 APK File</div>
                <div style="font-size: 12px; color: #666;">Click or drop APK file</div>
                <input type="file" id="apkFile" class="file-input" accept=".apk" onchange="handleAPKFile(this.files[0])">
                <div id="apkFileName" style="margin-top: 10px; font-weight: bold;"></div>
            </div>

            <div class="upload-area" onclick="document.getElementById('iconFile').click()" id="iconArea">
                <div>🖼️ App Icon (Optional)</div>
                <div style="font-size: 12px; color: #666;">Click or drop icon image</div>
                <input type="file" id="iconFile" class="file-input" accept="image/*" onchange="handleIconFile(this.files[0])">
                <div id="iconFileName" style="margin-top: 10px; font-weight: bold;"></div>
            </div>

            <div id="uploadMessage" class="message"></div>
            <button class="btn btn-primary" onclick="uploadFiles()" id="uploadBtn" disabled>Upload APK</button>
        </div>

        <!-- Link Upload -->
        <div id="link-upload" style="display: none;">
            <div class="form-group">
                <label>APK Download URL</label>
                <input type="url" id="apkLink" class="form-input" placeholder="https://example.com/app.apk">
            </div>
            <div class="form-group">
                <label>App Name</label>
                <input type="text" id="appName" class="form-input" placeholder="My App">
            </div>
            <div class="upload-area" onclick="document.getElementById('linkIconFile').click()">
                <div>🖼️ App Icon (Optional)</div>
                <input type="file" id="linkIconFile" class="file-input" accept="image/*" onchange="handleLinkIcon(this.files[0])">
            </div>
            <div id="linkUploadMessage" class="message"></div>
            <button class="btn btn-primary" onclick="uploadLink()">Upload Link</button>
        </div>
    </div>

    <!-- Manage Section -->
    <div id="manage" class="section">
        <h3>Manage APKs</h3>
        <div id="manageMessage" class="message"></div>
        <div id="apkList" class="apk-grid">
            <div style="text-align: center; padding: 40px; color: #666;">
                No APKs found. Upload your first APK!
            </div>
        </div>
    </div>

<script>
// Global variables
let apkFile = null;
let iconFile = null;
let linkIconFile = null;
const adminToken = localStorage.getItem('adminToken');

// Check login
if (!adminToken) {
    window.location.href = '/admin';
}

// Navigation
function showSection(sectionName) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(sectionName).classList.add('active');
    event.target.classList.add('active');
    
    if (sectionName === 'manage') loadAPKList();
    if (sectionName === 'dashboard') loadStats();
}

function showUploadTab(tab) {
    document.querySelectorAll('.upload-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('file-upload').style.display = tab === 'file' ? 'block' : 'none';
    document.getElementById('link-upload').style.display = tab === 'link' ? 'block' : 'none';
}

// File handling
function handleAPKFile(file) {
    if (!file.name.endsWith('.apk')) {
        showMessage('uploadMessage', 'Please select an APK file', 'error');
        return;
    }
    apkFile = file;
    document.getElementById('apkFileName').textContent = file.name;
    document.getElementById('apkArea').classList.add('has-file');
    checkUploadReady();
}

function handleIconFile(file) {
    if (!file.type.startsWith('image/')) {
        showMessage('uploadMessage', 'Please select an image file', 'error');
        return;
    }
    iconFile = file;
    document.getElementById('iconFileName').textContent = file.name;
    document.getElementById('iconArea').classList.add('has-file');
}

function handleLinkIcon(file) {
    if (file && !file.type.startsWith('image/')) {
        showMessage('linkUploadMessage', 'Please select an image file', 'error');
        return;
    }
    linkIconFile = file;
}

function checkUploadReady() {
    document.getElementById('uploadBtn').disabled = !apkFile;
}

// Upload functions
function uploadFiles() {
    if (!apkFile) return;
    
    const formData = new FormData();
    formData.append('apk', apkFile);
    
    fetch('/admin/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + adminToken },
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            if (iconFile) {
                const iconFormData = new FormData();
                iconFormData.append('icon', iconFile);
                iconFormData.append('apkName', data.filename.replace('.apk', ''));
                return fetch('/admin/upload-icon', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + adminToken },
                    body: iconFormData
                });
            }
            return { success: true };
        }
        throw new Error(data.message);
    })
    .then(() => {
        showMessage('uploadMessage', 'APK uploaded successfully!', 'success');
        resetUpload();
        setTimeout(() => showSection('manage'), 1000);
    })
    .catch(error => {
        showMessage('uploadMessage', 'Upload failed: ' + error.message, 'error');
    });
}

function uploadLink() {
    const link = document.getElementById('apkLink').value;
    const name = document.getElementById('appName').value;
    
    if (!link || !name) {
        showMessage('linkUploadMessage', 'Please fill all fields', 'error');
        return;
    }
    
    const formData = new FormData();
    formData.append('apkLink', link);
    formData.append('appName', name);
    if (linkIconFile) formData.append('icon', linkIconFile);
    
    fetch('/admin/upload-link', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + adminToken },
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            showMessage('linkUploadMessage', 'Link uploaded successfully!', 'success');
            document.getElementById('apkLink').value = '';
            document.getElementById('appName').value = '';
            setTimeout(() => showSection('manage'), 1000);
        } else {
            throw new Error(data.message);
        }
    })
    .catch(error => {
        showMessage('linkUploadMessage', 'Upload failed: ' + error.message, 'error');
    });
}

function resetUpload() {
    apkFile = null;
    iconFile = null;
    document.getElementById('apkFile').value = '';
    document.getElementById('iconFile').value = '';
    document.getElementById('apkFileName').textContent = '';
    document.getElementById('iconFileName').textContent = '';
    document.getElementById('apkArea').classList.remove('has-file');
    document.getElementById('iconArea').classList.remove('has-file');
    document.getElementById('uploadBtn').disabled = true;
}

// APK Management
function loadStats() {
    fetch('/api/apks', { headers: { 'Authorization': 'Bearer ' + adminToken } })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            document.getElementById('totalApks').textContent = data.apks.length;
            document.getElementById('linkApks').textContent = data.apks.filter(a => a.type === 'link').length;
        }
    });
}

function loadAPKList() {
    fetch('/api/apks', { headers: { 'Authorization': 'Bearer ' + adminToken } })
    .then(r => r.json())
    .then(data => {
        const list = document.getElementById('apkList');
        if (data.success && data.apks.length > 0) {
            list.innerHTML = data.apks.map(apk => `
                <div class="apk-card">
                    <img src="${apk.icon ? '/apks/files/' + apk.icon : '/admin/default-icon.png'}" 
                         class="apk-icon" onerror="this.src='/admin/default-icon.png'">
                    <div style="font-weight: bold; margin: 10px 0;">${apk.name}</div>
                    <div style="display: flex; gap: 10px; justify-content: center;">
                        ${apk.type === 'link' ? 
                            `<button class="btn btn-primary" onclick="window.open('${apk.apkLink}', '_blank')">Download</button>` :
                            `<button class="btn btn-primary" onclick="downloadAPK('${apk.apk}')">Download</button>`
                        }
                        <button class="btn btn-danger" onclick="deleteAPK('${apk.name}', '${apk.type}')">Delete</button>
                    </div>
                </div>
            `).join('');
        } else {
            list.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">No APKs found</div>';
        }
    });
}

function downloadAPK(filename) {
    window.open(`/download/${filename}?token=${adminToken}`, '_blank');
}

function deleteAPK(name, type) {
    if (!confirm(`Delete ${name}?`)) return;
    
    const endpoint = type === 'link' ? `/admin/apk-link/${name}` : `/admin/apk/${name}`;
    
    fetch(endpoint, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + adminToken }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            showMessage('manageMessage', 'Deleted successfully', 'success');
            loadAPKList();
            loadStats();
        } else {
            showMessage('manageMessage', 'Delete failed', 'error');
        }
    });
}

// Utilities
function showMessage(elementId, message, type) {
    const element = document.getElementById(elementId);
    element.textContent = message;
    element.className = `message ${type}`;
    element.style.display = 'block';
    setTimeout(() => element.style.display = 'none', 3000);
}

function logout() {
    localStorage.removeItem('adminToken');
    window.location.href = '/admin';
}

// Initial load
loadStats();
</script>
</body>
</html>
